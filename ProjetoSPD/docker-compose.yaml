services:
  broker:
    build: ./infra
    ports:
      - "127.0.0.1:5555:5555"
      - "127.0.0.1:5556:5556"

  proxy:
    build: ./infra
    command: ["python", "proxy.py"]
    ports:
      - "127.0.0.1:5557:5557"
      - "127.0.0.1:5558:5558"

  referencia:
    build: ./python
    command: ["python", "referencia.py"]
    environment:
      ENDERECO_REFERENCIA_BIND: tcp://*:5559
      BANCO_REFERENCIA: /app/dados/referencia.db
      PRAZO_HEARTBEAT: "60"
    volumes:
      - dados_referencia:/app/dados
    ports:
      - "127.0.0.1:5559:5559"

  servpy:
    build: ./python
    scale: 2
    environment:
      ENDERECO_BROKER: tcp://broker:5556
      ENDERECO_REFERENCIA: tcp://referencia:5559
      ENDERECO_PUBLICACAO: tcp://proxy:5557
      ARQUIVO_BANCO: /app/dados/servpy.db
    volumes:
      - /app/dados
    depends_on:
      - broker
      - proxy
      - referencia

  cliente-python:
    build: ./python
    scale: 2
    command: ["python", "cliente.py"]
    environment:
      ENDERECO_BROKER: tcp://broker:5555
      ENDERECO_INSCRICAO: tcp://proxy:5558
    depends_on:
      - broker
      - proxy
      - servpy

  servjava:
    build: ./Java
    scale: 2
    environment:
      ENDERECO_BROKER: tcp://broker:5556
      ENDERECO_REFERENCIA: tcp://referencia:5559
      ENDERECO_PUBLICACAO: tcp://proxy:5557
      ARQUIVO_BANCO: /app/dados/servjava.db
    volumes:
      - /app/dados
    depends_on:
      - broker
      - proxy
      - referencia

  cliente-java:
    build: ./Java
    scale: 2
    command: ["java", "-cp", "target/classes:target/lib/*", "Cliente"]
    environment:
      ENDERECO_BROKER: tcp://broker:5555
      ENDERECO_INSCRICAO: tcp://proxy:5558
    depends_on:
      - broker
      - proxy
      - servjava

  servc:
    build: ./C
    scale: 2
    environment:
      ENDERECO_BROKER: tcp://broker:5556
      ENDERECO_REFERENCIA: tcp://referencia:5559
      ENDERECO_PUBLICACAO: tcp://proxy:5557
      ARQUIVO_BANCO: /app/dados/servc.db
    volumes:
      - /app/dados
    depends_on:
      - broker
      - proxy
      - referencia

  cliente-c:
    build: ./C
    scale: 2
    command: ["./cliente"]
    environment:
      ENDERECO_BROKER: tcp://broker:5555
      ENDERECO_INSCRICAO: tcp://proxy:5558
    depends_on:
      - broker
      - proxy
      - servc

volumes:
  dados_referencia:
  dados_servjava:
  dados_servpy: