# Partes 1 e 2 em Python.
# Java e C serão adicionados quando as implementações estiverem prontas.
services:
  broker:
    build: ./infra
    ports:
      - "127.0.0.1:5555:5555"
      - "127.0.0.1:5556:5556"

  proxy:
    build: ./infra
    command: ["python", "proxy.py"]
    ports:
      - "127.0.0.1:5557:5557"
      - "127.0.0.1:5558:5558"

  servpy:
    build: ./python
    scale: 2
    environment:
      ENDERECO_BROKER: tcp://broker:5556
      ENDERECO_PUBLICACAO: tcp://proxy:5557
      ARQUIVO_BANCO: /app/dados/servpy.db
    volumes:
      # Volume individual: cada réplica recebe seu próprio banco.
      - /app/dados
    depends_on:
      - broker
      - proxy

  cliente-python:
    build: ./python
    scale: 2
    command: ["python", "cliente.py"]
    environment:
      ENDERECO_BROKER: tcp://broker:5555
      ENDERECO_INSCRICAO: tcp://proxy:5558
    depends_on:
      - broker
      - proxy
      - servpy

# Mantido para preservar a referência ao volume da primeira versão.
# As réplicas usam os volumes individuais definidos acima.
volumes:
  dados_servpy:
